version: '5'

services:

  user-postgres:
    image: 'postgres:15-alpine'
    container_name: 'userService-postgres'
    ports:
      - "5432:5432"
    environment:
      - 'POSTGRES_USER=${DB_USERNAME}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_DB=userdb'
    networks:
      - app-network
    volumes:
      - user_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  user-service:
    build: ../userServiceInno
    container_name: 'userService-inno'
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-postgres:5432/userdb
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:/db/changelog/db.changelog-master.xml
    depends_on:
      - user-postgres
      - redis
    networks:
      - app-network


  auth-postgres:
    image: 'postgres:15-alpine'
    container_name: 'authService-postgres'
    ports:
      - "5433:5432"
    environment:
      - 'POSTGRES_USER=${DB_USERNAME}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_DB=authdb'
    networks:
      - app-network
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

  auth-service:
    build: ../authServiceInno
    container_name: 'authService-inno'
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:/db/changelog/db.changelog-master.xml
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      REFRESH_EXPIRATION: ${REFRESH_EXPIRATION}
    depends_on:
      - auth-postgres
    networks:
      - app-network


  order-postgres:
    image: 'postgres:15-alpine'
    container_name: 'orderService-postgres'
    ports:
      - "5434:5432"
    environment:
      - 'POSTGRES_USER=${DB_USERNAME}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_DB=orderdb'
    networks:
      - app-network
    volumes:
      - order_postgres_data:/var/lib/postgresql/data

  order-service:
    build: ../orderServiceInno
    container_name: 'orderService-inno'
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-postgres:5432/orderdb
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      URL_USER_SERVICE: ${USER_SERVICE_URL}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:/db/changelog/db.changelog-master.xml
    depends_on:
      - order-postgres
      - kafka
    networks:
      - app-network


  payment-mongodb:
    image: mongo:7.0
    container_name: payment-mongodb
    ports:
      - "27017:27017"
    environment:
      - 'MONGO_INITDB_DATABASE=${MONGO_DB_NAME:-payment_db}'
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - app-network

  payment-service:
    build: ../paymentServiceInno
    container_name: 'paymentService-inno'
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://payment-mongodb:27017/payment_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - payment-mongodb
      - kafka
    networks:
      - app-network


  api-gateway:
    build: .
    container_name: 'api-gateway'
    ports:
      - "8888:8888"
    environment:
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-service
      - user-service
      - order-service
      - payment-service
    networks:
      - app-network

volumes:
  auth_postgres_data:
  user_postgres_data:
  order_postgres_data:
  mongo_data:
  kafka_data:

networks:
  app-network:
    driver: bridge